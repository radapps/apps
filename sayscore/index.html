<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Numbers</title>
<link rel="icon" href="data:,">
<!-- Roboto Condensed: the Android/Wear OS system condensed face. Loaded from Google Fonts
     when online; Android falls back to its built-in copy via "sans-serif-condensed". -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --font: "Roboto Condensed", sans-serif-condensed, "Arial Narrow", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    font-family: var(--font); font-variant-numeric: tabular-nums;
  }
  /* A square sized to the short side of the screen, centred. Everything inside is laid out in
     vmin so it scales to any watch and stays inside the round display. */
  #face { position: fixed; left: 50%; top: 50%; width: 100vmin; height: 100vmin; transform: translate(-50%, -50%); }
  #rows {
    position: absolute; left: 0; right: 0; top: 10vmin; height: 55vmin;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  }
  .row {
    white-space: nowrap; line-height: 1.08; font-weight: 500;
    transition: font-size .32s ease, opacity .32s ease, color .32s ease;
  }
  .row.l0 { color: #8c8c8c; }               /* oldest, top, smallest */
  .row.l1 { color: #c8c8c8; }               /* middle */
  .row.l2 { color: #fff; font-weight: 700; } /* main row, bottom, largest */
  .row.gone { opacity: 0; }
  .sep { color: #707070; padding: 0 .04em; }
  .n { display: inline-block; }
  .n.new { animation: pop .28s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(.25em); } to { opacity: 1; transform: none; } }
  #status {  /* only shows text while loading or when something is wrong */
    position: absolute; left: 12vmin; right: 12vmin; bottom: calc(10vmin + max(17vmin, 40px));
    text-align: center; font-size: 5vmin; line-height: 1.15; color: #ffb74d;
  }
  #btn {
    position: absolute; left: 50%; bottom: 8vmin; transform: translateX(-50%);
    width: 46vmin; height: 17vmin; min-height: 40px; border: 0; border-radius: 999px;
    font: 700 7.5vmin/1 var(--font); letter-spacing: .02em; color: #000; background: #00c853; cursor: pointer;
  }
  #btn.stop { background: #ff5252; }
  #btn.busy { background: #3a3a3a; color: #fff; font-size: 6.2vmin; white-space: nowrap; }
  #btn:active { filter: brightness(.85); }
  #measure { position: absolute; left: -9999px; top: 0; visibility: hidden; white-space: nowrap; line-height: 1.08; }
  #debug { position: absolute; left: 18vmin; right: 18vmin; top: 7vmin; text-align: center; white-space: pre-line; font: 500 4.3vmin/1.2 var(--font); color: #6fc3ff; }
</style>
</head>
<body>
<div id="face">
  <div id="rows" aria-live="polite"></div>
  <div id="debug"></div>
  <div id="status" role="status"></div>
  <button id="btn" type="button">Start</button>
</div>
<span id="measure" aria-hidden="true"></span>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- settings
const CONFIG = {
  perRow: 3,          // numbers per row (pickleball doubles call: server score, receiver score, server #)
  rows: 3,            // rows on screen
  maxNumber: 30,      // no single number is ever above this
  continueMs: 4000,   // a fragment heard within this time finishes an unfinished row
  lang: 'en-US',
  // On-device recogniser (the default). Add ?engine=web to the address to use the browser's own instead.
  voskLib: ['https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js', 'vosk.js'],
  modelFile: 'sayscore-model.tar.gz',   // optional trimmed model next to this page (26 MB)...
  modelParts: ['sayscore-model.part1', 'sayscore-model.part2'],  // ...or the same split in two
  modelFallback: 'https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz',
  pauseSplit: 0.1,    // seconds of silence between words that starts a new number
  // Slow devices (watches): above this CPU load the page stops sending silence to the
  // recogniser and asks for each result as soon as the speaker stops. ?gate=on / ?gate=off override.
  gateLoad: 0.4,
};
const PARAMS = new URLSearchParams(location.search);
const DEBUG = PARAMS.has('debug');   // ?debug shows speed / lag figures at the top
const SIZES = [9.5, 12.5, 20];  // font size in vmin: top, middle, main
const MAXW  = [74, 84, 90];     // widest a row may be in vmin before it is scaled down

// The only words the on-device recogniser listens for. "start" as in "zero zero start".
const WORD_VALUE = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8,
  nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16,
  seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, start: 2 };
const GRAMMAR = JSON.stringify(Object.keys(WORD_VALUE).concat('[unk]'));
// Words the browser's recogniser sometimes writes for a lone number.
const ALIAS = { to: 'two', too: 'two', for: 'four', won: 'one', ate: 'eight', nought: 'zero' };

// ---------------------------------------------------------------- number parsing
// Every way to read a digit string as numbers 0..maxNumber: "112" -> [11,2] [1,12] [1,1,2];
// "002" -> [0,0,2]. (Google's recogniser writes "one one two" as 112.)
function digitSplits(d) {
  const maxLen = String(CONFIG.maxNumber).length;
  if (d.length > 9) return [d.split('').map(Number)];
  const out = [];
  (function walk(i, acc) {
    if (i === d.length) { out.push(acc); return; }
    for (let len = Math.min(maxLen, d.length - i); len >= 1; len--) {
      const part = d.substr(i, len);
      if (len > 1 && part[0] === '0') continue;
      if (+part > CONFIG.maxNumber) continue;
      walk(i + len, acc.concat(+part));
    }
  })(0, []);
  return out.length ? out : [d.split('').map(Number)];
}

// Turns one recognised phrase into numbers. Where a phrase can be read more than one way
// ("twenty five two" = 25,2 or 20,5,2; "112" = 11,2 or 1,1,2), it picks the reading that is a
// complete score call (three numbers ending in server 1 or 2), otherwise the plainest reading.
function parseNumbers(text) {
  const s = String(text || '').toLowerCase();
  const tokens = s.match(/\d+|[a-z]+|[,.;:!?]/g) || [];   // punctuation = a pause = separator
  const segs = [];   // each segment: list of alternative readings { nums, cost }
  let tensAt = -1;   // index of a lone "twenty" that the next word may complete
  for (let t of tokens) {
    if (/^\d/.test(t)) {
      tensAt = -1;
      const v = parseInt(t, 10);
      if (t.length === 1) segs.push([{ nums: [v], cost: 0 }]);
      else if (t[0] !== '0' && v <= CONFIG.maxNumber) {
        segs.push([{ nums: [v], cost: 0 }, { nums: t.split('').map(Number), cost: 1 }]);
      } else segs.push(digitSplits(t).map((nums) => ({ nums, cost: 0 })));
      continue;
    }
    t = ALIAS[t] || t;
    if (!(t in WORD_VALUE)) { tensAt = -1; continue; }   // not a number word: separator
    const v = WORD_VALUE[t];
    if (tensAt >= 0 && v >= 1 && v <= 9 && segs[tensAt].tens + v <= CONFIG.maxNumber) {
      const tens = segs[tensAt].tens;
      segs[tensAt] = [{ nums: [tens + v], cost: 0 }, { nums: [tens, v], cost: 1 }];
      tensAt = -1;
      continue;
    }
    const seg = [{ nums: [v], cost: 0 }];
    segs.push(seg);
    tensAt = -1;
    if (t === 'twenty' || t === 'thirty') { seg.tens = v; tensAt = segs.length - 1; }
  }
  const combos = segs.reduce((p, sg) => p * sg.length, 1);
  if (combos > 512) return segs.flatMap((sg) => sg[0].nums);
  let best = null;
  (function walk(i, nums, cost) {
    if (i === segs.length) {
      const call = nums.length === 3 ? 10 + (nums[2] === 1 || nums[2] === 2 ? 3 : 0) : 0;
      const score = call - cost;
      if (!best || score > best.score) best = { score, nums };
      return;
    }
    for (const alt of segs[i]) walk(i + 1, nums.concat(alt.nums), cost + alt.cost);
  })(0, [], 0);
  return best ? best.nums : [];
}

// ---------------------------------------------------------------- display
const face = document.getElementById('face');
const rowsEl = document.getElementById('rows');
const measure = document.getElementById('measure');
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');

let rows = [];     // row elements, oldest first; the last one is the main row
let current = [];  // numbers in the main row

const vmin = () => face.getBoundingClientRect().width / 100;
const levelOf = (i) => SIZES.length - rows.length + i;

function renderRow(el, nums) {
  el.textContent = '';
  nums.forEach((n, i) => {
    if (i) { const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = '-'; el.appendChild(sep); }
    const span = document.createElement('span');
    span.className = i === nums.length - 1 ? 'n new' : 'n';
    span.textContent = String(n);
    el.appendChild(span);
  });
}

function fitRow(el, level, instant) {
  const v = vmin(), base = SIZES[level] * v, max = MAXW[level] * v;
  measure.style.fontSize = base + 'px';
  measure.style.fontWeight = level === SIZES.length - 1 ? '700' : '500';
  measure.innerHTML = el.innerHTML;
  const w = measure.getBoundingClientRect().width;
  if (instant) el.style.transition = 'none';   // row just got longer: shrink at once, no overflow
  el.style.fontSize = (w > max ? base * max / w : base) + 'px';
  if (instant) { void el.offsetWidth; el.style.transition = ''; }
}

function layout(shifted) {
  rows.forEach((el, i) => {
    const lv = levelOf(i);
    el.className = 'row l' + lv;
    fitRow(el, lv, !shifted);
  });
}

function startRow() {
  current = [];
  const el = document.createElement('div');
  el.className = 'row l' + (SIZES.length - 1);
  el.style.fontSize = '0px';
  rowsEl.appendChild(el);
  rows.push(el);
  if (rows.length > CONFIG.rows) {
    const old = rows.shift();
    old.classList.add('gone');
    old.style.fontSize = '0px';
    setTimeout(() => old.remove(), 400);
  }
  void el.offsetWidth; // let the new row grow from 0
}

// Each recognised phrase is one score call. A full call always starts a fresh row, so one
// missed or extra number never shifts the rows after it. A short fragment heard right after
// an unfinished row (e.g. "four two" ... "one") completes that row.
let lastHeard = 0;
function handleNumbers(list) {
  if (!list.length) return;
  const now = Date.now();
  const P = CONFIG.perRow;
  let shifted = false;
  const finishRow = current.length > 0 && current.length < P &&
    current.length + list.length <= P && now - lastHeard < CONFIG.continueMs;
  if (!finishRow) { startRow(); shifted = true; }
  for (const n of list) {
    if (current.length >= P) { startRow(); shifted = true; }
    current.push(n);
    renderRow(rows[rows.length - 1], current);
  }
  lastHeard = now;
  layout(shifted);
}

window.addEventListener('resize', () => layout(false));

// ---------------------------------------------------------------- helpers
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const setStatus = (msg) => { statusEl.textContent = msg || ''; };
const setBtn = (cls, label) => { btn.className = cls; btn.textContent = label; };

// ---------------------------------------------------------------- keep the screen on
// Screen Wake Lock API where available; otherwise a tiny looping video, which also keeps
// Android screens awake. Video clips from NoSleep.js (c) Rich Tibbett, MIT licence.

// ---------------------------------------------------------------- start / stop
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let running = false;
let session = 0;   // bumps on every start/stop so stale async work can bail out
let tried = {};    // engines already tried in this session

function start() {
  running = true;
  const my = ++session;
  tried = {};
  setStatus('');
  wake.on();
  const wantWeb = new URLSearchParams(location.search).get('engine') === 'web';
  if (wantWeb && SR) startWeb(my); else startVosk(my);
}

function stop(message) {
  running = false;
  session++;
  stopWeb();
  stopVosk();
  wake.off();
  setBtn('', 'Start');
  setStatus(message || '');
}

btn.addEventListener('click', () => { if (running) stop(); else start(); });

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && audio && audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
});

// ---------------------------------------------------------------- engine: browser speech recognition (?engine=web)
let rec = null;
let quickEnds = 0;

function startWeb(my) {
  tried.web = true;
  setBtn('stop', 'Stop');
  const r = new SR();
  rec = r;
  r.lang = CONFIG.lang;
  r.interimResults = false;
  r.maxAlternatives = 1;
  // Android ends a session after each phrase anyway; restarting is more reliable there.
  r.continuous = !/Android/i.test(navigator.userAgent);
  let began = 0, heard = false;
  const done = new Set();
  r.onaudiostart = () => { heard = true; quickEnds = 0; };
  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal || done.has(i)) continue;
      done.add(i);
      handleNumbers(parseNumbers(e.results[i][0].transcript));
    }
  };
  r.onerror = (e) => {
    if (my !== session || rec !== r) return;
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    fallbackToVosk(my);   // the browser's recogniser can't work here
  };
  r.onend = () => {
    if (my !== session || rec !== r) return;
    if (!heard && Date.now() - began < 1500 && ++quickEnds >= 4) { fallbackToVosk(my); return; }
    setTimeout(() => {
      if (my !== session || rec !== r) return;
      began = Date.now(); heard = false; done.clear();
      try { r.start(); } catch (err) { fallbackToVosk(my); }
    }, 250);
  };
  began = Date.now();
  try { r.start(); } catch (err) { fallbackToVosk(my); }
}

function stopWeb() {
  if (!rec) return;
  const r = rec;
  rec = null;
  try { r.abort(); } catch (e) {}
}

function fallbackToVosk(my) {
  if (my !== session) return;
  stopWeb();
  if (tried.vosk) { stop(tried.voskError || 'Speech not available here'); return; }
  startVosk(my);
}

// ---------------------------------------------------------------- engine 2: on-device (Vosk, WebAssembly)
let voskModel = null, voskLoading = null, audio = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = resolve;
    s.onerror = () => { s.remove(); reject(new Error('lib')); };
    document.head.appendChild(s);
  });
}

async function loadVoskLib() {
  if (window.Vosk) return;
  for (const src of CONFIG.voskLib) {
    try { await loadScript(src); if (window.Vosk) return; } catch (e) {}
  }
  throw new Error('lib');
}

// Where to get the model: the trimmed model split in two parts next to this page (each part is
// small enough for GitHub's web uploader), a single local file, or the full hosted model.
async function modelSource() {
  const abs = (f) => new URL(f, location.href).href;  // absolute: the library resolves URLs from its worker
  const exists = async (u) => {
    try { const r = await fetch(u, { method: 'HEAD', cache: 'no-store' }); return r.ok; } catch (e) { return false; }
  };
  if (await exists(abs(CONFIG.modelParts[0]))) return { url: abs(CONFIG.modelFile), parts: CONFIG.modelParts.map(abs) };
  if (await exists(abs(CONFIG.modelFile))) return { url: abs(CONFIG.modelFile), parts: null };
  return { url: CONFIG.modelFallback, parts: null };
}

// Runs inside the library's worker before its own code. It reports download progress, joins

      if (!r.ok) return r;
      resps.push(r);
      total += Number(r.headers.get('Content-Length')) || 0;
    }
    self.postMessage({ event: 'progress', loaded: 0, total });
    const body = new ReadableStream({
      async start(ctrl) {
        try {
          for (const r of resps) {
            const reader = r.body.getReader();
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              loaded += value.length;
              ctrl.enqueue(value);
              const now = Date.now();
              if (now - last > 500) { last = now; self.postMessage({ event: 'progress', loaded, total }); }
            }
          }
          self.postMessage({ event: 'progress', loaded, total, done: true });
          ctrl.close();
        } catch (e) { ctrl.error(e); }
      },
    });
    return new Response(body, { status: 200, headers: { 'Content-Type': 'application/gzip' } });
  };
}

let loadStage = '', progress = null, stageAt = 0;
function setStage(s) { loadStage = s; stageAt = Date.now(); }

function getModel() {
  if (voskModel) return Promise.resolve(voskModel);
  if (!voskLoading) {
    voskLoading = (async () => {
      setStage('engine');
      await loadVoskLib();
      const src = await modelSource();
      src.slow = Number(PARAMS.get('slow')) || 1;
      setStage('model');
      let crash;
      const crashed = new Promise((resolve, reject) => { crash = reject; });
      const RealWorker = window.Worker;
      window.Worker = function (url, opts) {
        const code = '(' + workerPrelude + ')(' + JSON.stringify(src) + ');\nimportScripts(' + JSON.stringify(url) + ');';
        const w = new RealWorker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })), opts);
        w.addEventListener('error', () => {
          crash(new Error('crash'));
          if (voskModel && audio) stop('Speech engine crashed');
          voskModel = null;
        });
        return w;
      };
      let m;
      try { m = new window.Vosk.Model(src.url, -1); } finally { window.Worker = RealWorker; }
      m.on('perf', onPerf);
      m.on('progress', (p) => { progress = { loaded: p.loaded, total: p.total, done: !!p.done, at: Date.now() }; if (p.done) setStage('unpack'); else loadStage = 'download'; });
      // The model is downloaded once, then kept in the browser's storage (IndexedDB).
      await Promise.race([crashed, new Promise((resolve, reject) => {
        m.on('load', (msg) => (msg && msg.result ? resolve() : reject(new Error('model'))));
        m.on('error', () => reject(new Error('model')));
      })]);
      voskModel = m;
      return m;
    })().catch((e) => { voskLoading = null; throw e; });
  }
  return voskLoading;
}

function numbersFromVosk(result) {
  if (!result) return [];
  const words = result.result;
  if (!Array.isArray(words) || !words.length) return parseNumbers(result.text);
  let text = '', prevEnd = null;
  for (const w of words) {
    if (prevEnd !== null && w.start - prevEnd >= CONFIG.pauseSplit) text += ' ,';
    text += ' ' + w.word;
    prevEnd = w.end;
  }
  return parseNumbers(text);
}

// ---------------------------------------------------------------- speed tracking + silence gate
// The recogniser reports how long it spends per second of audio ("load"). If a device can't
// comfortably keep up (a watch), feeding it continuous audio makes it fall further behind the
// longer it listens. So on slow devices the page only sends audio while someone is talking
// (plus a short lead-in), and asks for the result as soon as they stop. Between calls the
// recogniser sits idle and catches up, which also saves battery.
const dbg = { load: 0, heard: 0, busy: 0, sent: 0, heardBase: 0, gate: false, open: false,
              micAt: 0, speechEndAt: 0, lastResultAt: 0, lastDelay: null, log: [], rate: 0 };

function gateWanted() {
  const g = PARAMS.get('gate');
  if (g === 'on') return true;
  if (g === 'off') return false;
  return lsGet('numbers.gate') === '1';
}

function onPerf(p) {
  const dHeard = p.heard - dbg.heard, dBusy = p.busy - dbg.busy;
  dbg.heard = p.heard; dbg.busy = p.busy;
  if (dHeard > 0.3) {
    const load = dBusy / dHeard;
    dbg.load = dbg.load ? dbg.load * 0.6 + load * 0.4 : load;
  }
  if (!PARAMS.get('gate') && !dbg.gate && dbg.load > CONFIG.gateLoad && dbg.heard - dbg.heardBase > 2) {
    dbg.gate = true;                 // this device is slow: gate from now on
    lsSet('numbers.gate', '1');
  }
  showDebug();
}

function showDebug() {
  const el = document.getElementById('debug');
  if (!DEBUG || !el) return;
  if (!audio) { el.textContent = ''; return; }
  const behind = Math.max(0, dbg.sent - (dbg.heard - dbg.heardBase));
  el.textContent = 'CPU ' + Math.round(dbg.load * 100) + '%' +
    (dbg.gate ? ' · gate' + (dbg.open ? ' ●' : ' ○') : '') +
    (dbg.rate && dbg.rate !== 16000 ? ' · ' + Math.round(dbg.rate / 1000) + 'kHz' : '') + '\n' +
    'behind ' + behind.toFixed(1) + 's' +
    (dbg.lastDelay !== null ? ' · last ' + dbg.lastDelay.toFixed(1) + 's' : '');
}
setInterval(showDebug, 1000);

function wireAudio(ctx, recognizer) {
  const SIZE = 2048;                                  // 128 ms per chunk at 16 kHz
  const chunkSec = SIZE / ctx.sampleRate;
  const PRE = Math.ceil(0.35 / chunkSec);             // lead-in kept from before the speech
  const HANG = Math.ceil(0.6 / chunkSec);             // silence after speech before asking for the result
  const MAXOPEN = Math.ceil(8 / chunkSec);            // never stay open longer than this
  const proc = ctx.createScriptProcessor(SIZE, 1, 1);
  const pre = [];
  let noise = 0, hang = 0, openFor = 0;
  dbg.gate = gateWanted(); dbg.open = false; dbg.rate = ctx.sampleRate;
  dbg.sent = 0; dbg.heardBase = dbg.heard; dbg.lastDelay = null; dbg.speechEndAt = 0;
  const send = (x) => {
    try { recognizer.acceptWaveformFloat(x, ctx.sampleRate); } catch (err) {}
    dbg.sent += x.length / ctx.sampleRate;
  };
  // Loudness is judged in 16 ms slices: speech stays loud for many slices in a row, while a
  // paddle pop or a clap fills only one or two, so pops don't open the gate.
  const SLICE = Math.round(ctx.sampleRate * 0.016);
  const ABS_MIN = 4e-6;                                // ignore anything quieter than this (power)
  proc.onaudioprocess = (e) => {
    const x = new Float32Array(e.inputBuffer.getChannelData(0));   // copy: the browser may reuse it
    // The speech detector always runs, so it is already tuned to the room if the gate switches
    // on mid-session; with the gate off every chunk is still sent straight away.
    const gating = dbg.gate;
    const slices = Math.floor(x.length / SLICE);
    const powers = new Array(slices);
    let quietest = Infinity;
    for (let k = 0; k < slices; k++) {
      let s = 0;
      for (let i = k * SLICE, end = i + SLICE; i < end; i++) s += x[i] * x[i];
      powers[k] = s / SLICE;
      if (powers[k] < quietest) quietest = powers[k];
    }
    if (!noise) noise = Math.max(quietest, 1e-7);
    const thr = Math.max(noise * (dbg.open ? 3 : 6), ABS_MIN);  // +5 dB to stay open, +8 dB to open
    let loudSlices = 0;
    for (let k = 0; k < slices; k++) if (powers[k] > thr) loudSlices++;
    const loud = loudSlices >= (dbg.open ? 2 : 4);              // 4 slices = 64 ms of sound to open
    // Background level follows the quietest slice, which pops and voices barely touch.
    noise += (quietest - noise) * (quietest < noise ? 0.3 : (dbg.open ? 0.01 : 0.05));
    if (dbg.open) {
      send(x);
      openFor++;
      if (loud) { hang = HANG; dbg.speechEndAt = performance.now(); }
      else if (--hang <= 0 || openFor > MAXOPEN) {
        dbg.open = false;
        if (gating) { try { recognizer.retrieveFinalResult(); } catch (err) {} }
      }
    } else if (loud) {
      dbg.open = true; hang = HANG; openFor = 0; dbg.speechEndAt = performance.now();
      pre.forEach(send); pre.length = 0;
      send(x);
    } else if (gating) {
      pre.push(x);                      // hold back silence; keep a short lead-in
      if (pre.length > PRE) pre.shift();
    } else {
      send(x);
    }
  };
  return proc;
}

function errorMessage(err) {
  const name = err && err.name, msg = err && err.message;
  if (name === 'NotAllowedError' || name === 'SecurityError') return 'Microphone blocked';
  if (name === 'NotFoundError') return 'No microphone found';
  if (msg === 'nomic') return 'This browser can’t use the mic';
  if (msg === 'lib') return 'Could not load speech engine';
  if (msg === 'model') return 'Speech model failed to load';
  if (msg === 'crash') return 'Speech engine crashed';
  return 'Speech not available here';
}

const MB = (b) => (b / 1048576).toFixed(b < 10485760 ? 1 : 0);

// What the status line says while loading, so a slow watch never just shows a counter.
function loadingText() {
  const since = (Date.now() - stageAt) / 1000;
  switch (loadStage) {
    case 'mic': return since > 15 ? 'No mic prompt? Browser may block it' : 'Allow the microphone';
    case 'engine': return 'Loading speech engine';
    case 'model': return lsGet('numbers.model') ? 'Loading model' : 'Starting download';
    case 'download': {
      if (!progress) return 'Downloading model';
      if (Date.now() - progress.at > 45000) return 'Download stalled – check Wi-Fi';
      return 'Downloading ' + MB(progress.loaded) + (progress.total ? ' of ' + MB(progress.total) : '') + ' MB';
    }
    case 'unpack': return since > 90 ? 'Still unpacking…' : 'Unpacking model';
    default: return '';
  }
}

async function startVosk(my) {
  tried.vosk = true;
  setBtn('busy', 'Loading');
  const t0 = Date.now();
  setStage('mic');
  const tick = () => {
    if (my !== session || audio) return;
    btn.textContent = 'Loading ' + Math.round((Date.now() - t0) / 1000) + 's';
    setStatus(loadingText());
  };
  tick();
  const timer = setInterval(tick, 1000);
  let stream = null;
  const dropStream = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; };
  try {
    // Ask for the mic first: if this browser can't give web pages the mic, say so before
    // spending minutes downloading the model.
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomic');
    dbg.micAt = 0;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 },
    });
    dbg.micAt = performance.now();
    if (my !== session) { dropStream(); return; }
    if (!voskModel) setStage('engine');
    tick();
    const model = await getModel();
    if (my !== session) { dropStream(); return; }
    lsSet('numbers.model', '1');
    let ctx, src;
    try {
      ctx = new AudioContext({ sampleRate: 16000 }); // model's native rate: less work on the watch
      src = ctx.createMediaStreamSource(stream);
    } catch (e) {
      if (ctx) ctx.close().catch(() => {});
      ctx = new AudioContext();
      src = ctx.createMediaStreamSource(stream);
    }
    const recognizer = new model.KaldiRecognizer(ctx.sampleRate, GRAMMAR);
    recognizer.setWords(true);
    recognizer.on('result', (msg) => {
      const nums = numbersFromVosk(msg.result);
      if (nums.length) {
        dbg.lastResultAt = performance.now();
        dbg.log.push({ t: dbg.lastResultAt, nums });
        if (dbg.speechEndAt) dbg.lastDelay = (dbg.lastResultAt - dbg.speechEndAt) / 1000;
      }
      handleNumbers(nums);
    });
    const proc = wireAudio(ctx, recognizer);
    src.connect(proc);
    proc.connect(ctx.destination);
    if (ctx.state !== 'running') { try { await ctx.resume(); } catch (e) {} }
    audio = { ctx, stream, src, proc, recognizer };
    stream = null;
    setStage('');
    setBtn('stop', 'Stop');
    setStatus('');
  } catch (err) {
    dropStream();
    if (my !== session) return;
    const engineProblem = err && (err.message === 'lib' || err.message === 'model' || err.message === 'nomic' || err.message === 'crash');
    tried.voskError = errorMessage(err);
    if (engineProblem && SR && !tried.web) { setStatus(''); startWeb(my); return; }  // last resort
    stop(errorMessage(err));
  } finally {
    clearInterval(timer);
  }
}

function stopVosk() {
  if (!audio) return;
  const a = audio;
  audio = null;
  try { a.proc.onaudioprocess = null; a.src.disconnect(); a.proc.disconnect(); } catch (e) {}
  a.stream.getTracks().forEach((t) => t.stop());
  try { a.recognizer.retrieveFinalResult(); } catch (e) {}   // flush the last few words
  setTimeout(() => { try { a.recognizer.remove(); } catch (e) {} }, 800);
  a.ctx.close().catch(() => {});
}

// For testing in a desktop browser console.
window.numbersApp = { parseNumbers, handleNumbers, numbersFromVosk, dbg: () => dbg };
})();
</script>
</body>
</html>
